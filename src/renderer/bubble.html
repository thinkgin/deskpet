<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; }
    body { display:flex; align-items:flex-start; justify-content:flex-start; padding:4px; font-family:"Microsoft YaHei",sans-serif; }
    #bubble { width:max-content; max-width:260px; min-width:88px; max-height:140px; padding:8px 11px; overflow:hidden; color:#4a3b35; background:rgba(255,255,255,.97); border:2px solid #4a3b35; border-radius:13px; box-shadow:0 2px 8px rgba(0,0,0,.18); font-size:12px; line-height:1.5; text-align:left; overflow-wrap:anywhere; }
    #bubble.loading { display:flex; min-width:58px; align-items:center; justify-content:center; gap:5px; padding:12px 15px; }
    .dot { display:none; width:6px; height:6px; border-radius:50%; background:#9b7d66; animation:bounce .9s infinite ease-in-out; }
    .loading .dot { display:block; }
    .dot:nth-child(2) { animation-delay:.12s; }
    .dot:nth-child(3) { animation-delay:.24s; }
    @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:.45; } 30% { transform:translateY(-4px); opacity:1; } }
  </style>
</head>
<body>
  <div id="bubble"><span id="text"></span><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
  <script src="bubble.js"></script>
</body>
</html>
