<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>和宠物聊天</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
    html, body { background: transparent; overflow: hidden; height: 100%; }
    #chat {
      width: 100%; height: 100%;
      background: rgba(255, 250, 244, 0.97);
      border: 2px solid #4a3b35;
      border-radius: 16px;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }
    #bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      background: #4a3b35; color: #fff;
      border-radius: 14px 14px 0 0;
      cursor: move;
    }
    #bar .dot { width: 12px; height: 12px; border-radius: 50%; }
    #bar .dot.r { background: #ff5f57; }
    #bar .dot.y { background: #febc2e; }
    #bar .dot.g { background: #28c840; }
    #bar .title { flex: 1; text-align: center; font-size: 13px; }
    #bar .close {
      background: #ff5f57; color: #fff; border: none; border-radius: 8px;
      width: 26px; height: 26px; font-size: 14px; cursor: pointer; line-height: 1;
    }
    #msgs {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 80%; padding: 8px 11px; border-radius: 12px; font-size: 13px; line-height: 1.55; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #ffe3c2; color: #4a3b35; border-top-right-radius: 3px; }
    .msg.pet { align-self: flex-start; background: #fff; border: 1px solid #eadfd3; color: #4a3b35; border-top-left-radius: 3px; }
    .msg.pet .who { font-size: 11px; color: #b0876a; margin-bottom: 2px; }
    #input-row {
      display: flex; gap: 8px; padding: 10px 12px;
      background: #faf3ea; border-top: 1px solid #eadfd3;
    }
    #input {
      flex: 1; border: 1.5px solid #d9c9b8; border-radius: 10px;
      padding: 8px 10px; font-size: 13px; outline: none; background: #fff;
    }
    #send {
      border: none; background: #4a3b35; color: #fff;
      border-radius: 10px; padding: 0 16px; font-size: 13px; cursor: pointer;
    }
    #send:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div id="chat">
    <div id="bar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
      <div class="title">和宠物聊天</div>
      <button class="close" id="close">✕</button>
    </div>
    <div id="msgs"></div>
    <div id="input-row">
      <input id="input" placeholder="和我说点什么吧…" />
      <button id="send">发送</button>
    </div>
  </div>
  <script src="chat.js"></script>
</body>
</html>
